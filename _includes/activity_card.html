<article class="activity-card" id="activity-{{ include.item.collection }}--{{ include.item.uid }}" tabindex="-1">
  <p class="content-eyebrow">{{ include.item.kind | escape }}</p>
  <h3><a href="{{ include.item.url | relative_url }}">{{ include.item.title | escape }}</a></h3>
  <p>{{ include.item.summary | escape }}</p>
  {% include activity_relations.html item=include.item %}
  <a class="content-more" href="{{ include.item.url | relative_url }}">자세히 보기 <span class="visually-hidden">{{ include.item.title | escape }}</span> <span aria-hidden="true">→</span></a>
</article>
